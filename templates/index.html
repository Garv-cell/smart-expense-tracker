<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Finance Dashboard</p>
          <h1>Smart Expense Tracker</h1>
        </div>
        <div class="month-picker">
          <label for="monthSelect">Month</label>
          <input id="monthSelect" type="month" />
        </div>
      </header>

      <main class="content-grid">
        <div class="left-stack">
          <section class="panel summary-panel">
            <h2>Summary</h2>
            <div class="summary-cards">
              <article class="card income">
                <span>Income</span>
                <strong id="incomeTotal">$0.00</strong>
              </article>
              <article class="card expense">
                <span>Expenses</span>
                <strong id="expenseTotal">$0.00</strong>
              </article>
              <article class="card net">
                <span>Net</span>
                <strong id="netTotal">$0.00</strong>
              </article>
            </div>
          </section>

          <section class="panel panel-form">
            <h2>Add Transaction</h2>
            <form id="transactionForm" class="form-grid">
              <div>
                <label for="type">Type</label>
                <select id="type" name="type">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </div>
              <div>
                <label for="category">Category</label>
                <input id="category" name="category" list="categoryOptions" placeholder="Food" required />
                <datalist id="categoryOptions"></datalist>
              </div>
              <div>
                <label for="amount">Amount</label>
                <input id="amount" name="amount" type="number" step="0.01" min="0.01" required />
              </div>
              <div>
                <label for="date">Date</label>
                <input id="date" name="date" type="date" required />
              </div>
              <div class="full-width">
                <label for="description">Description</label>
                <input id="description" name="description" placeholder="Groceries" />
              </div>
              <button type="submit" class="primary-action">Add transaction</button>
            </form>
            <div id="transactionMessage" class="message" aria-live="polite"></div>
          </section>
        </div>

        <div class="right-stack">
          <section class="panel panel-budget">
            <h2>Monthly Budget</h2>
            <form id="budgetForm" class="form-grid compact">
              <div>
                <label for="budgetCategory">Category</label>
                <input id="budgetCategory" name="budgetCategory" list="categoryOptions" placeholder="Food" required />
              </div>
              <div>
                <label for="budgetAmount">Budget Amount</label>
                <input id="budgetAmount" name="budgetAmount" type="number" step="0.01" min="0.01" required />
              </div>
              <button type="submit" class="primary-action">Save Budget</button>
            </form>
            <div id="budgetMessage" class="message" aria-live="polite"></div>
            <div id="budgetList" class="budget-list"></div>
          </section>

          <section class="panel chart-panel compact-chart">
            <h2>Spending by Category</h2>
            <canvas id="categoryChart"></canvas>
          </section>
        </div>

        <section class="panel chart-panel trend-panel">
          <h2>Monthly Trend</h2>
          <canvas id="trendChart"></canvas>
        </section>

        <section class="panel table-panel">
          <div class="table-header">
            <h2>Transactions</h2>
            <div class="search-box">
              <input id="searchInput" type="search" placeholder="Search transactions" />
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Type</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Amount</th>
                </tr>
              </thead>
              <tbody id="transactionTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
